name: CI

# Task 4 -- run on every push and every pull request, on all branches
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write        # required for keyless Workload Identity Federation

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "dvc[gs]" scikit-learn pandas joblib pytest

      # Task 3 -- keyless auth to GCP via Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/323241830917/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: dvc-ci@project-a0a1f4bf-9c68-4b93-a84.iam.gserviceaccount.com

      # Task 3 -- fetch versioned data + model from the DVC GCS remote
      - name: DVC pull
        run: dvc pull --force

      # Tasks 1 & 2 -- run the validation + evaluation test suite
      - name: Run tests
        run: pytest -v tests/ | tee pytest_output.txt

      # Task 5 -- publish a CML report as a PR / commit comment
      - name: CML report
        if: always()
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## CI Report — IRIS Pipeline" > report.md
          echo "" >> report.md
          echo "### pytest results" >> report.md
          echo '```' >> report.md
          cat pytest_output.txt >> report.md
          echo '```' >> report.md
          cml comment create report.md
